name: Composer Install
description: Install Composer dependencies

inputs:
  composer-path:
    description: The path to the composer directory relative to the repository root
    required: true

runs:
  using: composite

  steps:
    - name: Install Composer dependencies
      shell: bash
      run: |
        docker run --rm -v $(pwd)/${{ inputs.composer-path }}:/src -w /src docker.io/library/composer:2 install --no-interaction --ignore-platform-req=ext-gd
