name: Release Workflow

on:
  workflow_call:
    inputs:
      image-name:
        description: The name of the Docker image to build and release (required if docker-build-and-release is true)
        required: false
        type: string
        default: ""
      composer-install:
        description: Whether to install Composer dependencies before building
        required: false
        type: boolean
        default: false
      composer-install-path:
        description: The path to the composer directory relative to the repository root
        required: false
        type: string
        default: src
      phpunittest:
        description: Whether to run a phpunittest suite before releasing
        required: false
        type: boolean
        default: false
      phpunittest-src-path:
        description: Path to the directory containing all PHP code, relative to the repository root
        required: false
        type: string
        default: src
      docker-build-and-release:
        description: Whether to build and push the Docker image
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ inputs.image-name }}

jobs:
  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # https://github.com/actions/checkout#Fetch-all-history-for-all-tags-and-branches

      - name: Composer Install
        id: composer-install
        if: ${{ inputs.composer-install }}
        uses: simonjensen/pipelines/.github/actions/composer-install@main
        with:
          composer-path: ${{ inputs.composer-install-path }}

      - name: Run phpunittest
        id: phpunittests
        if: ${{ inputs.phpunittest }}
        uses: simonjensen/pipelines/.github/actions/phpunittest@main
        with:
          src-path: ${{ inputs.phpunittest-src-path }}

      - name: Create Release
        id: create-release
        uses: huggingface/semver-release-action@v1.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build And Release
        id: docker-build-and-release
        if: ${{ inputs.docker-build-and-release }}
        uses: simonjensen/pipelines/.github/actions/docker-build-and-publish@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.create-release.outputs.tag }}
